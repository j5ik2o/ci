name: Review Thread Resolution

on:
  workflow_call:
    inputs:
      pr_number:
        description: PR number to refresh. Leave empty to refresh all open PRs for base_branch.
        required: false
        type: string
        default: ""
      base_branch:
        description: Base branch to evaluate.
        required: false
        type: string
        default: main
      required_context:
        description: Commit status context published for branch protection.
        required: false
        type: string
        default: Check unresolved comments
      wait_for_other_checks:
        description: Wait for other PR checks before evaluating review threads.
        required: false
        type: string
        default: "true"
      publish_status:
        description: Publish the synthetic commit status on same-repository PR heads.
        required: false
        type: string
        default: "true"
      skip_status_for_dependabot:
        description: Skip synthetic commit status publication for Dependabot PR authors.
        required: false
        type: string
        default: "true"
      ignored_auto_report_patterns:
        description: Newline-separated literal substrings for top-level bot report comments or review summaries that should not require acknowledgement.
        required: false
        type: string
        default: |
          <!-- This is an auto-generated comment: summarize by coderabbit.ai -->
          <!-- This is an auto-generated comment by CodeRabbit for review status -->
          <!-- walkthrough_start -->
          <!-- pre_merge_checks_walkthrough_start -->
          ## Review limit reached
          ## Walkthrough
          ### Edited Notification
          ### Blocked Notification
          ### Edited/Blocked Notification
          ## [Codecov](
          <!-- BUGBOT_REVIEW -->
          <!-- devin-review-badge-begin -->
      extra_ignored_auto_report_patterns:
        description: Additional newline-separated literal substrings appended to ignored_auto_report_patterns.
        required: false
        type: string
        default: ""
      ci_ref:
        description: Ref of j5ik2o/ci to check out for shared scripts. Pin this to the same tag as the reusable workflow.
        required: false
        type: string
        default: v1

permissions:
  contents: read
  checks: write
  issues: read
  pull-requests: read
  statuses: write

concurrency:
  group: ${{ inputs.wait_for_other_checks == 'false' && format('review-thread-resolution-ci-{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr_number || github.run_id) || format('review-thread-resolution-event-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  unresolved-comments:
    name: ${{ inputs.wait_for_other_checks == 'false' && 'Evaluate CI review-thread gate' || 'Refresh review-thread state' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout shared CI scripts
        uses: actions/checkout@v6
        with:
          repository: j5ik2o/ci
          ref: ${{ inputs.ci_ref }}
          path: .shared-ci
          persist-credentials: false

      - name: Evaluate review-thread state
        uses: ./.shared-ci/actions/review-thread-resolution
        with:
          repository: ${{ github.repository }}
          pr_number: ${{ inputs.pr_number }}
          base_branch: ${{ inputs.base_branch }}
          required_context: ${{ inputs.required_context }}
          wait_for_other_checks: ${{ inputs.wait_for_other_checks }}
          publish_status: ${{ inputs.publish_status }}
          skip_status_for_dependabot: ${{ inputs.skip_status_for_dependabot }}
          ignored_auto_report_patterns: ${{ inputs.ignored_auto_report_patterns }}
          extra_ignored_auto_report_patterns: ${{ inputs.extra_ignored_auto_report_patterns }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
