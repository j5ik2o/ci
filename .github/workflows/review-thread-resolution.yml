name: Review Thread Resolution

on:
  workflow_call:
    inputs:
      pr_number:
        description: PR number to refresh. Leave empty to refresh all open PRs for base_branch.
        required: false
        type: string
        default: ""
      base_branch:
        description: Base branch to evaluate.
        required: false
        type: string
        default: main
      required_context:
        description: Commit status context published for branch protection.
        required: false
        type: string
        default: Check unresolved comments
      wait_for_other_checks:
        description: Mode. "true" (default) is an event refresh whose job succeeds even with unresolved review state; "false" is a CI gate whose job fails on it. Neither mode waits for other checks (the name is kept for compatibility).
        required: false
        type: string
        default: "true"
      publish_status:
        description: Publish the synthetic commit status on same-repository PR heads.
        required: false
        type: string
        default: "true"
      skip_status_for_dependabot:
        description: Skip synthetic commit status publication for Dependabot PR authors.
        required: false
        type: string
        default: "true"
      ignored_auto_report_patterns:
        description: Newline-separated literal substrings for top-level bot report comments or review summaries that should not require acknowledgement.
        required: false
        type: string
        default: |
          <!-- This is an auto-generated comment: summarize by coderabbit.ai -->
          <!-- This is an auto-generated comment by CodeRabbit for review status -->
          <!-- walkthrough_start -->
          <!-- pre_merge_checks_walkthrough_start -->
          <!-- BUGBOT_REVIEW -->
          <!-- devin-review-badge-begin -->
      extra_ignored_auto_report_patterns:
        description: Additional newline-separated literal substrings appended to ignored_auto_report_patterns.
        required: false
        type: string
        default: ""
      ignored_auto_report_author_patterns:
        description: Newline-separated author and literal substring pairs separated by a tab. Use this for generic report text that must stay author-scoped.
        required: false
        type: string
        default: |
          coderabbitai	## Review limit reached
          coderabbitai	## Walkthrough
          renovate	### Edited Notification
          renovate	### Blocked Notification
          renovate	### Edited/Blocked Notification
          codecov	## [Codecov](
          chatgpt-codex-connector	Codex Review
          chatgpt-codex-connector	You have reached your Codex usage limits for code reviews.
      extra_ignored_auto_report_author_patterns:
        description: Additional newline-separated author and literal substring pairs appended to ignored_auto_report_author_patterns.
        required: false
        type: string
        default: ""
      ci_ref:
        description: Ref of j5ik2o/ci to check out for shared scripts. Pin this to the same tag as the reusable workflow.
        required: false
        type: string
        default: v1

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

# One run per PR and mode. The PR number follows resolve_pr_number in the
# script: an explicit pr_number (not empty, not "null") wins over the event's
# PR. Event-driven refreshes cancel the older run. Cancellation never touches
# the commit status: nothing newer cancels the newest run, and that run
# publishes success or failure, or error when the evaluation fails after the
# PR head is known (for example a GitHub API failure). CI gate runs queue
# instead, because their job result feeds the caller's aggregate CI job.
# Refresh-all runs (schedule, workflow_dispatch without pr_number) share one
# queued group; non-PR issue comments get their own group and exit early.
concurrency:
  group: >-
    ${{ format('review-thread-resolution-{0}-{1}',
      inputs.wait_for_other_checks == 'false' && 'ci' || 'event',
      (inputs.pr_number != '' && inputs.pr_number != 'null' && inputs.pr_number)
        || github.event.pull_request.number
        || (github.event.issue.pull_request && github.event.issue.number)
        || github.event.workflow_run.pull_requests[0].number
        || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'refresh-all')
        || format('run-{0}', github.run_id)) }}
  cancel-in-progress: ${{ inputs.wait_for_other_checks != 'false' && github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && (inputs.pr_number == '' || inputs.pr_number == 'null')) }}

jobs:
  unresolved-comments:
    name: ${{ inputs.wait_for_other_checks == 'false' && 'Evaluate CI review-thread gate' || 'Refresh review-thread state' }}
    runs-on: ubuntu-latest
    # A single PR takes seconds; refresh-all takes about 4 seconds per open PR.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (inputs.pr_number == '' || inputs.pr_number == 'null') && 30 || 10 }}
    steps:
      - name: Checkout shared CI scripts
        uses: actions/checkout@v6
        with:
          repository: j5ik2o/ci
          ref: ${{ inputs.ci_ref }}
          path: .shared-ci
          persist-credentials: false

      - name: Evaluate review-thread state
        uses: ./.shared-ci/actions/review-thread-resolution
        with:
          repository: ${{ github.repository }}
          pr_number: ${{ inputs.pr_number }}
          base_branch: ${{ inputs.base_branch }}
          required_context: ${{ inputs.required_context }}
          wait_for_other_checks: ${{ inputs.wait_for_other_checks }}
          publish_status: ${{ inputs.publish_status }}
          skip_status_for_dependabot: ${{ inputs.skip_status_for_dependabot }}
          ignored_auto_report_patterns: ${{ inputs.ignored_auto_report_patterns }}
          extra_ignored_auto_report_patterns: ${{ inputs.extra_ignored_auto_report_patterns }}
          ignored_auto_report_author_patterns: ${{ inputs.ignored_auto_report_author_patterns }}
          extra_ignored_auto_report_author_patterns: ${{ inputs.extra_ignored_auto_report_author_patterns }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
